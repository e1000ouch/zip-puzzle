name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc make zip

      - name: Compilation
        run: make CFLAGS="-std=c11 -O2 -Wall -Wextra -Werror"

      - name: Tests de la logique du jeu
        run: make test

      - name: Paquet Windows
        run: |
          mkdir -p dist/ZIP
          cp zip.exe dist/ZIP/
          cp docs/LISEZMOI.txt dist/ZIP/
          cd dist && zip -r ZIP-windows-x64.zip ZIP

      - uses: actions/upload-artifact@v4
        with:
          name: ZIP-windows-x64
          path: dist/ZIP-windows-x64.zip

      - name: Publication de la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ZIP-windows-x64.zip
          body_path: docs/RELEASE_NOTES.md
